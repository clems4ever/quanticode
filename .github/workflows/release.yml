name: Release

# A release is always a tag. Two ways to make one:
#
#   * "Run workflow" in the Actions tab, choosing patch, minor or major — the
#     next version is derived from the highest existing v* tag, and the tag is
#     created here.
#   * Pushing a v* tag yourself, when you want to name the version exactly.
#
# A tag pushed by GITHUB_TOKEN does not itself start a workflow, so the manual
# path creates its tag and carries straight on rather than triggering a second,
# duplicate run.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      prerelease:
        description: "Mark as a pre-release (does not move latest)"
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Everything CI runs, on the exact commit being released. A release that
  # cannot pass its own tests should not reach the registry.
  verify:
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      semver: ${{ steps.resolve.outputs.semver }}
      previous: ${{ steps.resolve.outputs.previous }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the version to release
        id: resolve
        env:
          BUMP: ${{ github.event.inputs.bump }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Highest existing release tag. Pre-releases are ignored when
            # working out where we are, so v0.3.0-rc.1 does not become the
            # base for the next bump.
            previous="$(git tag --list --sort=v:refname 'v*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | tail -n 1 || true)"
            previous="${previous:-v0.0.0}"

            rest="${previous#v}"
            major="${rest%%.*}"
            rest="${rest#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"

            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "::error::unknown bump '$BUMP'"; exit 1 ;;
            esac

            version="v${major}.${minor}.${patch}"
            echo "$previous + $BUMP -> $version"
          else
            version="${GITHUB_REF_NAME}"
            previous=""
          fi

          # v1.2.3, optionally -rc.1 or +build
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a valid version. Expected vMAJOR.MINOR.PATCH, e.g. v0.2.0"
            exit 1
          fi

          # A pre-release by tag shape, or because the operator ticked the box.
          prerelease=false
          if printf '%s' "$version" | grep -q -- '-'; then prerelease=true; fi
          if [ "${INPUT_PRERELEASE:-false}" = "true" ]; then prerelease=true; fi

          {
            echo "version=$version"
            echo "semver=${version#v}"
            echo "previous=$previous"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Releasing \`$version\`"
            echo
            if [ -n "$previous" ]; then echo "- previous release: \`$previous\` (bump: \`$BUMP\`)"; fi
            echo "- pre-release: \`$prerelease\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION already exists. Release from a newer commit, or delete the tag first."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "quanticode $VERSION"
          git push origin "refs/tags/$VERSION"

  publish:
    name: Publish image and release
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # "latest" and the floating vX / vX.Y tags only move for a real release;
      # a pre-release publishes under its exact version and nothing else.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ needs.prepare.outputs.prerelease == 'false' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pull the freshly published image back and check it actually starts and
      # serves a real repository, rather than trusting that it built.
      - name: Smoke-test the published image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.semver }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"

          got="$(docker run --rm "$IMAGE" -version)"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::image reports version '$got', expected '$VERSION'"
            exit 1
          fi

          # Serve this very checkout, mounted read-only and owned by another uid.
          docker run -d --name smoke -p 8090:8090 \
            -v "$PWD:/repo:ro" "$IMAGE" -repo self=/repo
          for _ in $(seq 1 60); do
            if curl -sf localhost:8090/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl -sf localhost:8090/healthz >/dev/null
          curl -sf localhost:8090/ | grep -q quanticode
          files="$(curl -sf localhost:8090/api/repo | jq '.meta.totalFiles')"
          echo "analysed $files files from the published image"
          test "$files" -gt 0
          docker rm -f smoke

      # The Dockerfile that produced the image, attached to the release, so the
      # exact build recipe for a version is readable without a checkout.
      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp Dockerfile "dist/Dockerfile-${{ needs.prepare.outputs.version }}"

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: quanticode ${{ needs.prepare.outputs.version }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/Dockerfile-${{ needs.prepare.outputs.version }}
          body: |
            ## Container image

            ```sh
            docker run --rm -p 8090:8090 \
              -v /path/to/a/git/clone:/repo:ro \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.semver }} \
              -repo myrepo=/repo
            ```

            Then open <http://localhost:8090>.

            Built for `linux/amd64` and `linux/arm64`.
            Digest: `${{ steps.build.outputs.digest }}`
